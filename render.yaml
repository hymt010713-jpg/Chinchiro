# Render の Blueprint。Render で「New → Blueprint」からこのリポジトリを選ぶと、この設定で公開される。
services:
  - type: web
    name: chinchiro-go
    runtime: node
    plan: free
    # 日本から近いリージョン
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w @chinchiro/server
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
